name: Android Debug CI

on:
  push:
    branches:
      - agent/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate clean Android runner for build verification
        run: flutter create --platforms=android --project-name islami_hayat .

      - name: Configure generated runner for notification desugaring
        run: python3 scripts/configure_android_desugaring.py

      - name: Apply hardened Android manifest and backup policy
        run: |
          mkdir -p android/app/src/main/res/xml
          cp android_hardening/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp android_hardening/backup_rules.xml android/app/src/main/res/xml/backup_rules.xml
          cp android_hardening/data_extraction_rules.xml android/app/src/main/res/xml/data_extraction_rules.xml

      - name: Materialize Android home widget bridge
        run: python3 scripts/configure_android_home_widget_t0297.py

      - name: Audit Android source security policy
        run: python3 scripts/audit_android_security.py

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Audit final APK permissions
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          AAPT2="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt2"
          PERMS="$($AAPT2 dump permissions "$APK")"
          printf '%s\n' "$PERMS"
          FORBIDDEN='ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|RECORD_AUDIO|CAMERA|READ_CONTACTS|WRITE_CONTACTS|GET_ACCOUNTS'
          if printf '%s\n' "$PERMS" | grep -E "$FORBIDDEN"; then
            echo "Forbidden sensitive permission found in final APK" >&2
            exit 1
          fi
          echo "Final APK permission audit PASS"

      - name: Verify home widget is packaged
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          AAPT2="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt2"
          MANIFEST="$($AAPT2 dump xmltree --file AndroidManifest.xml "$APK")"
          ZIP_ENTRIES="$(unzip -Z1 "$APK")"
          printf '%s\n' "$MANIFEST" | grep -F 'IslamiHayatWidgetProvider'
          printf '%s\n' "$MANIFEST" | grep -F 'android.appwidget.action.APPWIDGET_UPDATE'
          printf '%s\n' "$ZIP_ENTRIES" | grep -Fx 'res/xml/islami_hayat_widget_info.xml'
          printf '%s\n' "$ZIP_ENTRIES" | grep -Fx 'res/layout/islami_hayat_widget.xml'
          echo "T0297 packaged widget audit PASS"
