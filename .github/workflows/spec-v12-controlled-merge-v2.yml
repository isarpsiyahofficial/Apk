name: Controlled SPEC v1.2 Post-Merge Consistency

on:
  push:
    branches:
      - agent/islamic-life-implementation
    paths:
      - .github/workflows/spec-v12-controlled-merge-v2.yml

permissions:
  contents: write

jobs:
  spec-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/islamic-life-implementation
          fetch-depth: 0

      - name: Patch only stale post-merge planning text
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('SPECIFICATION.md')
          text = path.read_text(encoding='utf-8')

          required_state = [
              '**Sürüm:** v1.2',
              '## AK. v1.2 KONTROLLÜ BİRLEŞİM — BAĞLAYICI DELTA KARARLARI',
              '943. Bu `SPECIFICATION.md` dosyası v1.2 itibarıyla ürünün tek ana şartname kaynağıdır',
          ]
          missing = [needle for needle in required_state if needle not in text]
          if missing:
              raise SystemExit(f'post-merge state missing; refusing cleanup: {missing}')

          old = '''## SONRAKİ PLANLI ADIMLAR

1. **100 Canva paylaşım görselini tek tek lisans/provenance/export hakkıyla doğrulayıp final asset havuzunu sabitlemek.**
2. Şartnameyi görsel seçimlerinden sonra v1.2 olarak güncellemek.
3. Bu şartnameden hiçbir maddeyi atlamadan kronolojik `TODO.md` üretmek.
4. Daha sonra uygulama geliştirmesine TODO sırasıyla başlamak.'''
          new = '''## SONRAKİ PLANLI ADIMLAR

1. **100 Canva paylaşım görselini tek tek lisans/provenance/export hakkıyla doğrulayıp final asset havuzunu sabitlemek.**
2. v1.2 master şartnameyle `TODO.md` ve `TEST_MATRIX.md` arasındaki açık release kapılarını kronolojik olarak kapatmak.
3. Her tamamlanan görevde gerçek davranış, failure-path, localization/RTL ve responsive kanıtını ilgili TODO/Test Matrix kaydına bağlamak.
4. SPEC + TODO + TEST_MATRIX üzerinde kırmızı/açık release engeli kalmadan uygulamayı final kabul etmemek.'''

          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale planning block, found {text.count(old)}')
          text = text.replace(old, new, 1)

          forbidden = [
              'Şartnameyi görsel seçimlerinden sonra v1.2 olarak güncellemek.',
              'Bu şartnameden hiçbir maddeyi atlamadan kronolojik `TODO.md` üretmek.',
              'Daha sonra uygulama geliştirmesine TODO sırasıyla başlamak.',
          ]
          leftovers = [needle for needle in forbidden if needle in text]
          if leftovers:
              raise SystemExit(f'stale post-merge planning text remains: {leftovers}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate exact documentation diff
        run: |
          git diff --check
          git diff -- SPECIFICATION.md

      - name: Commit post-merge consistency fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SPECIFICATION.md
          git commit -m "docs: align post-merge next steps with v1.2 master"
          git push origin HEAD:agent/islamic-life-implementation
