name: Flutter CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-reflection-lifecycle:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/islamic-life-implementation' && github.event.head_commit.message != 'fix: repair reflection controller lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/islamic-life-implementation
          fetch-depth: 0

      - name: Patch reflection controller lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/quran/presentation/quran_reader_page.dart')
          s = p.read_text()
          old = """    controller.dispose();\n    if (result == null || !mounted) return;\n"""
          new = """    // The dialog route can still be finishing its exit transition after\n    // showDialog completes. Disposing the controller synchronously here can\n    // leave EditableText attached to a disposed controller on Flutter 3.47.\n    // Let the route own the final detach first, then release the controller.\n    WidgetsBinding.instance.addPostFrameCallback((_) => controller.dispose());\n    if (result == null || !mounted) return;\n"""
          if old not in s:
              raise SystemExit('expected controller disposal block not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test test/features/quran/quran_reflection_note_ui_test.dart --reporter expanded

      - name: Restore normal CI and commit validated repair
        env:
          ORIGINAL_FLUTTER_CI_B64: 
        run: |
          printf '%s' "$ORIGINAL_FLUTTER_CI_B64" | base64 -d > .github/workflows/flutter-ci.yml
          rm -f .github/workflows/repair-reflection-controller.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/quran/presentation/quran_reader_page.dart .github/workflows/flutter-ci.yml .github/workflows/repair-reflection-controller.yml
          git commit -m 'fix: repair reflection controller lifecycle'
          git push origin HEAD:agent/islamic-life-implementation
