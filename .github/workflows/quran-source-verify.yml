name: Quran Source Verify

on:
  push:
    branches:
      - agent/**
    paths:
      - 'scripts/fetch_tanzil_uthmani.py'
      - 'scripts/validate_quran_dataset.py'
      - 'scripts/test_validate_quran_dataset.py'
      - '.github/workflows/quran-source-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quran-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-official-tanzil:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unit test Quran validator
        working-directory: scripts
        run: python3 -m unittest -v test_validate_quran_dataset.py

      - name: Fetch exact Tanzil Uthmani source
        run: >-
          python3 scripts/fetch_tanzil_uthmani.py
          --output build/quran-source/quran-uthmani.txt
          --manifest build/quran-source/quran-uthmani.manifest.json

      - name: Re-validate downloaded source and exact-byte hash
        run: >-
          python3 scripts/validate_quran_dataset.py
          build/quran-source/quran-uthmani.txt
          --manifest build/quran-source/quran-uthmani.revalidated.manifest.json

      - name: Compare manifests
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path('build/quran-source/quran-uthmani.manifest.json').read_text())
          b = json.loads(Path('build/quran-source/quran-uthmani.revalidated.manifest.json').read_text())
          for key in ('sha256', 'bytes', 'ayahs', 'surahs', 'layout'):
              if a[key] != b[key]:
                  raise SystemExit(f'manifest mismatch for {key}: {a[key]} != {b[key]}')
          print(f"verified sha256={a['sha256']} bytes={a['bytes']} layout={a['layout']}")
          PY

      - name: Upload verified canonical source
        uses: actions/upload-artifact@v4
        with:
          name: verified-tanzil-uthmani
          path: build/quran-source/
          if-no-files-found: error
          retention-days: 7
