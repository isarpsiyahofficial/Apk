name: Android Debug CI

on:
  push:
    branches:
      - agent/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate clean Android runner for build verification
        run: flutter create --platforms=android --project-name islami_hayat .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build Android debug APK
        run: flutter build apk --debug
