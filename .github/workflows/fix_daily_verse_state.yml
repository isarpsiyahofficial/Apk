name: Fix Daily Verse State

on:
  push:
    branches:
      - agent/islamic-life-implementation
    paths:
      - .github/workflows/fix_daily_verse_state.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/islamic-life-implementation
      - name: Patch synchronous setState
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/today/presentation/today_page.dart')
          text = path.read_text()
          old = '      setState(() => _stateFuture = Future.value(state));'
          new = '''      setState(() {\n        _stateFuture = Future.value(state);\n      });'''
          if old not in text:
              raise SystemExit('expected state update not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/today/presentation/today_page.dart
          git commit -m "fix: keep daily verse setState synchronous"
          git push origin HEAD:agent/islamic-life-implementation
