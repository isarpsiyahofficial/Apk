name: Android Emulator Smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate clean Android runner
        run: flutter create --platforms=android --project-name islami_hayat .

      - name: Apply hardened Android policy
        run: |
          mkdir -p android/app/src/main/res/xml
          cp android_hardening/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp android_hardening/backup_rules.xml android/app/src/main/res/xml/backup_rules.xml
          cp android_hardening/data_extraction_rules.xml android/app/src/main/res/xml/data_extraction_rules.xml
          python3 scripts/audit_android_security.py

      - name: Install dependencies and localizations
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb shell am force-stop com.example.islami_hayat
            adb shell am start -W -n com.example.islami_hayat/.MainActivity | tee /tmp/start.txt
            grep -E 'Status: ok|ThisTime:|TotalTime:' /tmp/start.txt
            sleep 4
            PID="$(adb shell pidof com.example.islami_hayat | tr -d '\r')"
            test -n "$PID"
            echo "App process running with PID $PID"
            adb shell dumpsys activity activities | grep -m 1 'com.example.islami_hayat/.MainActivity'
            if adb logcat -d -t 500 | grep -E 'FATAL EXCEPTION.*com\.example\.islami_hayat|Process: com\.example\.islami_hayat.*FATAL'; then
              echo 'Fatal application crash found after launch' >&2
              exit 1
            fi
            echo 'Android emulator install/launch smoke PASS'
