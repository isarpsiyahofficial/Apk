name: Android Debug CI

on:
  push:
    branches:
      - agent/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate clean Android runner for build verification
        run: flutter create --platforms=android --project-name islami_hayat .

      - name: Apply hardened Android manifest and backup policy
        run: |
          mkdir -p android/app/src/main/res/xml
          cp android_hardening/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp android_hardening/backup_rules.xml android/app/src/main/res/xml/backup_rules.xml
          cp android_hardening/data_extraction_rules.xml android/app/src/main/res/xml/data_extraction_rules.xml

      - name: Audit Android security policy
        run: python3 scripts/audit_android_security.py

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build Android debug APK
        run: flutter build apk --debug
