name: islami_hayat
description: Source-transparent Islamic life and knowledge application.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^5.1.0
  timezone: ^0.10.1
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# CI resolves dependencies without a committed lockfile. Keep the transitive
# Objective-C hook on the latest published Dart 3.10-compatible release known
# to compile with the project's Flutter/Dart toolchain. A transient 9.6.1
# resolution referenced Architecture.arm64e, which is unavailable in Dart
# 3.13.3 and failed before the Flutter test suite could start.
dependency_overrides:
  objective_c: 9.6.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/quran/source/
    - assets/quran/meals/
    - assets/history/maps/
