name: SPEC v1.2 Consistency Gate

on:
  push:
    branches:
      - agent/islamic-life-implementation
    paths:
      - .github/workflows/spec-v12-consistency-patch.yml
      - SPECIFICATION.md
      - TODO.md
      - TEST_MATRIX.md
      - SPECIFICATION_V1_2_DELTA.md

permissions:
  contents: read

jobs:
  verify-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/islamic-life-implementation
          fetch-depth: 2

      - name: Verify v1.2 governance consistency
        run: |
          python3 - <<'PY'
          from pathlib import Path

          spec = Path('SPECIFICATION.md').read_text(encoding='utf-8')
          todo = Path('TODO.md').read_text(encoding='utf-8')
          matrix = Path('TEST_MATRIX.md').read_text(encoding='utf-8')
          delta = Path('SPECIFICATION_V1_2_DELTA.md').read_text(encoding='utf-8')

          required_spec = [
              '**Sürüm:** v1.2',
              '404. Toplam **100 final Canva paylaşım görseli** olacaktır.',
              '657. 97 Rewarded/PRO görselin gate davranışı test edilir.',
              '666. Pro kullanıcının 100 görselde hiçbir reklam akışına düşmediği test edilir.',
              '944. Paylaşım havuzu tam olarak **100 Canva görselidir: 3 FREE + 97 Rewarded/PRO**.',
              '`islami_hayat_lifetime_pro`',
              '25 peygamberin her birinde sekiz semantik boyut',
              '`SPECIFICATION.md -> TODO.md -> TEST_MATRIX.md`',
              'v1.2 master şartnameyle `TODO.md` ve `TEST_MATRIX.md` arasındaki açık release kapılarını kronolojik olarak kapatmak.',
          ]
          missing = [needle for needle in required_spec if needle not in spec]
          if missing:
              raise SystemExit(f'missing governed v1.2 clauses: {missing}')

          forbidden_spec = [
              '27 premium görselin gate davranışı',
              'Pro kullanıcının 30 görselde',
              'Şartnameyi görsel seçimlerinden sonra v1.2 olarak güncellemek.',
              'Bu şartnameden hiçbir maddeyi atlamadan kronolojik `TODO.md` üretmek.',
              'Daha sonra uygulama geliştirmesine TODO sırasıyla başlamak.',
          ]
          leftovers = [needle for needle in forbidden_spec if needle in spec]
          if leftovers:
              raise SystemExit(f'residual v1.1 contradictions remain: {leftovers}')

          for task in ('T0001', 'T0002', 'T0003', 'T0004', 'T0005'):
              marker = f'- [x] **{task}**'
              if marker not in todo:
                  raise SystemExit(f'{task} is not closed in TODO')

          chain = '`SPECIFICATION.md` -> `TODO.md` -> `TEST_MATRIX.md`'
          if chain not in matrix:
              raise SystemExit('TEST_MATRIX v1.2 source chain missing')

          delta_required = [
              '3 kalıcı FREE + 97 Rewarded/PRO',
              '`islami_hayat_lifetime_pro`',
              'isim/kimlik → olay → Kur’an ayeti → hadis → aile/soy → dönem/kronoloji → coğrafya → tarih',
          ]
          delta_missing = [needle for needle in delta_required if needle not in delta]
          if delta_missing:
              raise SystemExit(f'v1.2 delta provenance unexpectedly changed: {delta_missing}')
          PY

      - name: Verify documentation whitespace
        run: git diff --check HEAD^ -- SPECIFICATION.md TODO.md TEST_MATRIX.md SPECIFICATION_V1_2_DELTA.md .github/workflows/spec-v12-consistency-patch.yml
